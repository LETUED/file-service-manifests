apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: host-only-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.64.240-192.168.64.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: host-only-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - host-only-pool
