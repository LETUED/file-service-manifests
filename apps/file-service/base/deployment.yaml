apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  labels:
    app.kubernetes.io/name: file-service
    app.kubernetes.io/part-of: file-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: file-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-service
        app.kubernetes.io/part-of: file-service
    spec:
      containers:
        - name: app
          image: superbdevops/file-service:1.3.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: local
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
